; Engine-extension registry for the NPatch converter and feature gating.
;
; DATA, not code, and deliberately so: which extensions exist and what they
; cover must not depend on a model's recollection of a niche project. Add an
; extension by adding a section here. ai/dll_detect.py already reports which
; DLLs a mod actually ships, so `dll=` is what lets the converter say "this
; needs Phobos, which you don't have" instead of just "unportable".
;
; dll=      basename, no .dll, lowercased — matched by dll_detect.normalize_dll
; provides= coarse feature areas, for recommending an extension the user lacks
; tags=     how many INI keys we have on record (see sources below)
; verified= where that tag list came from, so a stale entry is obvious

[Antares]
label=Antares (Ares reconstruction)
dll=antares
repo=https://github.com/Antares-Developers/Antares
docs=https://ares-developers.github.io/Ares-docs/
tags=408
verified=knowledge/09_ares_flags.md (ModENC-derived; incomplete, see notes)
provides=superweapons,prerequisites,sides,dominator,droppod,paradrop,nuke,bounty,immunity-via-verses,convert-deploy
notes=Reconstructs Ares 3.0p1 (21.352.1218); docs are the Ares docs. CANNOT be
notes2=loaded alongside Ares.dll — both go through Syringe. Preferred target for
notes3=all YR work in this project.

[Ares]
label=Ares
dll=ares
docs=https://ares-developers.github.io/Ares-docs/
tags=408
verified=same flag list as Antares
provides=same as Antares
notes=Mutually exclusive with Antares.dll. Present only for detection.

[Phobos]
label=Phobos
dll=phobos
repo=https://github.com/Phobos-developers/Phobos
docs=https://phobos.readthedocs.io/en/latest/
tags=1546
verified=local checkout docs/*.md PLUS src/**/*.{cpp,h} "Read(...)" key literals
provides=radiation-types,attacheffect,burst-delays,alt-firing-offsets,laser-thickness,shake-is-local,variables,droppod-customisation
notes=Independent of Ares and does not require it; intended to accompany it.
notes2=Docs alone are NOT a complete tag list — they omit AttachEffect.AttachTypes
notes3=and LaserThickness, which the source demonstrably reads. Scan the source.
notes4=Compatibility with Antares specifically is UNVERIFIED (shares contributors).
notes5=Does NOT overlap with Ares behaviourally — similar systems that never
notes6=cross paths (user, 2026-10-16). The real interaction surface is with
notes7=Kratos; see the Kratos section and docs/NPATCH_TO_ARES.md trap 3.

[Kratos]
label=Kratos (KratosPP)
dll=kratos
repo=https://github.com/ra2diy/KratosPP
docs=https://wiki.ra2diy.com/w/Kratos:%E8%AF%B4%E6%98%8E%E4%B9%A6
manual=附件包/Kratos食用说明书.ini (in-repo; the authoritative tag list)
tags=1335
verified=manual .ini, 121 sections, fetched 2026-10-16
provides=attacheffect,decoy-missiles,trail-types,land-types,stand-ins,combat-damage-takeover,base-node-rules
notes=DLL basename confirmed by the user 2026-10-16 (Kratos.dll).
notes3=Documentation is Chinese. It documents its OWN Phobos conflicts inline
notes4=(e.g. AllowDamageIfDebrisHitWater is inert under Phobos — use Phobos's
notes5=ExplodeOnWater instead), which is directly useful to the converter.
notes6=Its AE system is 'same as Ares AttachEffect' but REGISTRY-FREE (write
notes7=the AE type inline). Settings inherited from Ares are marked '(Ares)'
notes8=in the manual. It does NOT override Ares — VERIFIED against the source
notes9=2026-10-16: self-described 'Ares-like', reuses Ares UTILITY SOURCE under
notes10=licence at compile time, and deliberately partitions hook addresses and
notes11=command IDs (0x50-0x51 only) away from Ares and Phobos.
conflicts_with=phobos
conflict_source=the manual documents Kratos/Phobos conflicts PER TAG — some
conflict_source2=inert under Phobos, some hard conflicts, one deliberate
conflict_source3=takeover, one deliberately key-compatible. Consult it rather
conflict_source4=than treating 'Kratos + Phobos' as a single yes/no.

; The user's own niche feature DLLs live on their GitHub and are added here as
; they stabilise. Each only needs dll= and provides= to participate in
; "you need extension X for this NPatch feature".
